name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - name: fmt check
        run: cargo fmt --check
      - name: build
        run: cargo build -p seam-core -p seam-platform -p seam-process -p seam -p seam-idl
      - name: test seam-core
        run: cargo test -p seam-core -- --nocapture
      - name: test seam-platform (lane primitive + canonical)
        run: cargo test -p seam-platform -- --nocapture
      - name: clippy
        run: cargo clippy -p seam-core -p seam-platform -p seam-process -p seam -p seam-idl --all-targets -- -D warnings
