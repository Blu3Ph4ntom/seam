[package]
name = "seam-process"
version = "0.1.0"
edition = "2021"
description = "Seam process spawn/bootstrap helper (public-optional)"
publish = false

[dependencies]
seam-core = { path = "../seam-core" }
seam-platform = { path = "../seam-platform" }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "processthreadsapi", "winbase", "namedpipeapi", "fileapi", "minwinbase"] }
