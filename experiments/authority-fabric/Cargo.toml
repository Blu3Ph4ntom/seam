[package]
name = "authority-fabric"
version = "0.1.0"
edition = "2021"
publish = false

default-run = "host"

[lib]
name = "authority_fabric"
path = "src/lib.rs"

[[bin]]
name = "host"
path = "src/bin/host.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "service"
path = "src/bin/service.rs"

[dependencies]
getrandom = "0.3"
rustix = { version = "0.38", features = ["fs", "net"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
winapi = { version = "0.3", features = ["handleapi", "processthreadsapi", "winbase"] }

[dev-dependencies]
trybuild = "1"
